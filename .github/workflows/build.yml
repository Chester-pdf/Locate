name: build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Create project files
        run: |
          cat > build.gradle <<'LOCATE_EOF'
          plugins {
              id 'net.fabricmc.fabric-loom'
              id 'maven-publish'
          }

          version = project.mod_version
          group = project.maven_group

          base {
              archivesName = project.archives_base_name
          }

          repositories {
              maven {
                  name = 'TerraformersMC'
                  url = 'https://maven.terraformersmc.com/releases/'
              }
          }

          dependencies {
              minecraft "com.mojang:minecraft:${project.minecraft_version}"
              implementation "net.fabricmc:fabric-loader:${project.loader_version}"
              implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
              compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
          }

          tasks.register('printMcClasspath') {
              doLast {
                  configurations.compileClasspath.files.each { println "CP:${it}" }
              }
          }

          processResources {
              inputs.property "version", project.version
              filesMatching("fabric.mod.json") {
                  expand "version": project.version
              }
          }

          tasks.withType(JavaCompile).configureEach {
              it.options.release = 25
              it.options.encoding = 'UTF-8'
          }

          java {
              withSourcesJar()
              sourceCompatibility = JavaVersion.VERSION_25
              targetCompatibility = JavaVersion.VERSION_25
          }
          LOCATE_EOF

          cat > gradle.properties <<'LOCATE_EOF'
          org.gradle.jvmargs=-Xmx2G
          org.gradle.parallel=true

          minecraft_version=26.2
          loader_version=0.19.5
          loom_version=1.18.4
          fabric_api_version=0.161.0+26.2
          # ПРОВЕРЬ на modrinth.com/mod/modmenu (Versions -> 26.2) и подставь актуальную
          modmenu_version=18.0.0

          mod_version=1.0.0
          maven_group=dev.chester.locategui
          archives_base_name=locate-gui
          LOCATE_EOF

          cat > settings.gradle <<'LOCATE_EOF'
          pluginManagement {
              repositories {
                  maven {
                      name = 'Fabric'
                      url = 'https://maven.fabricmc.net/'
                  }
                  mavenCentral()
                  gradlePluginPortal()
              }
              plugins {
                  id 'net.fabricmc.fabric-loom' version providers.gradleProperty('loom_version').get()
              }
          }

          rootProject.name = 'locate-gui'
          LOCATE_EOF

          mkdir -p src/main/resources/assets/locate_gui/lang
          cat > src/main/resources/fabric.mod.json <<'LOCATE_EOF'
          {
            "schemaVersion": 1,
            "id": "locate_gui",
            "version": "${version}",
            "name": "Locate GUI",
            "description": "Button + text input analogue of /locate with RU/EN names, plus teleport points.",
            "license": "MIT",
            "environment": "client",
            "entrypoints": {
              "client": ["dev.chester.locategui.LocateModClient"],
              "modmenu": ["dev.chester.locategui.LocateModMenu"]
            },
            "depends": {
              "fabricloader": ">=0.19.2",
              "minecraft": "~26.2",
              "java": ">=25",
              "fabric-api": "*"
            },
            "suggests": {
              "modmenu": "*"
            }
          }
          LOCATE_EOF

