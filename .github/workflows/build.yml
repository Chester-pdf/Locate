          mkdir -p src/main/java/dev/chester/locategui
          cat > src/main/java/dev/chester/locategui/LocateModClient.java <<'LOCATE_EOF'
          package dev.chester.locategui;

          import com.mojang.blaze3d.platform.InputConstants;
          import net.fabricmc.api.ClientModInitializer;
          import net.fabricmc.fabric.api.client.event.lifecycle.v1.ClientTickEvents;
          import net.fabricmc.fabric.api.client.keymapping.v1.KeyMappingHelper;
          import net.minecraft.client.KeyMapping;
          import net.minecraft.resources.Identifier;

          public class LocateModClient implements ClientModInitializer {
              public static final String MOD_ID = "locate_gui";
              public static KeyMapping openKey;

              @Override
              public void onInitializeClient() {
                  KeyMapping.Category category = KeyMapping.Category.register(
                          Identifier.fromNamespaceAndPath(MOD_ID, "main"));

                  openKey = KeyMappingHelper.registerKeyMapping(new KeyMapping(
                          "key.locate_gui.open",
                          InputConstants.Type.KEYSYM,
                          InputConstants.KEY_G,
                          category));

                  ClientTickEvents.END_CLIENT_TICK.register(client -> {
                      while (openKey.consumeClick()) {
                          if (client.gui.screen() == null) {
                              client.gui.setScreen(new LocateScreen(null));
                          }
                      }
                  });

                  System.out.println("[Locate GUI] loaded");
              }
          }
          LOCATE_EOF

          cat > src/main/java/dev/chester/locategui/LocateScreen.java <<'LOCATE_EOF'
          package dev.chester.locategui;

          import com.mojang.blaze3d.platform.InputConstants;
          import net.minecraft.client.gui.components.Button;
          import net.minecraft.client.gui.components.EditBox;
          import net.minecraft.client.gui.components.StringWidget;
          import net.minecraft.client.gui.screens.Screen;
          import net.minecraft.client.input.KeyEvent;
          import net.minecraft.network.chat.Component;

          /** Поле ввода (RU/EN название) + кнопка. Поиск идёт напрямую, без команды /locate. */
          public class LocateScreen extends Screen {
              private final Screen parent;
              private EditBox input;
              private StringWidget status;

              public LocateScreen(Screen parent) {
                  super(Component.literal("Locate"));
                  this.parent = parent;
              }

              @Override
              protected void init() {
                  int cx = width / 2;
                  int cy = height / 2;

                  input = addRenderableWidget(new EditBox(font, cx - 100, cy - 20, 200, 20,
                          Component.translatable("locate_gui.screen.input")));
                  input.setMaxLength(64);
                  input.setHint(Component.translatable("locate_gui.screen.input"));
                  setInitialFocus(input);

                  addRenderableWidget(Button.builder(Component.translatable("locate_gui.screen.find"), b -> search())
                          .bounds(cx - 100, cy + 5, 200, 20).build());

                  addRenderableWidget(Button.builder(Component.translatable("locate_gui.screen.waypoints"),
                          b -> minecraft.gui.setScreen(new WaypointsScreen(this)))
                          .bounds(cx - 100, cy + 30, 200, 20).build());

                  status = addRenderableWidget(new StringWidget(cx - 150, cy + 58, 300, 9, Component.empty(), font));
              }

              private void search() {
                  String text = input.getValue().trim();
                  if (text.isEmpty()) {
                      return;
                  }
                  Names.Entry entry = Names.resolve(text);
                  if (entry == null) {
                      status.setMessage(Component.translatable("locate_gui.result.unknown", text));
                      return;
                  }
                  LocateSearch.run(minecraft, entry, status::setMessage);
              }

              @Override
              public boolean keyPressed(KeyEvent event) {
                  if (input.isFocused()
                          && (event.key() == InputConstants.KEY_RETURN || event.key() == InputConstants.KEY_NUMPADENTER)) {
                      search();
                      return true;
                  }
                  return super.keyPressed(event);
              }

              @Override
              public void onClose() {
                  minecraft.gui.setScreen(parent);
              }
          }
          LOCATE_EOF

          cat > src/main/java/dev/chester/locategui/WaypointsScreen.java <<'LOCATE_EOF'
          package dev.chester.locategui;

          import com.mojang.blaze3d.platform.InputConstants;
          import java.util.List;
          import net.minecraft.client.gui.components.Button;
          import net.minecraft.client.gui.components.EditBox;
          import net.minecraft.client.gui.components.StringWidget;
          import net.minecraft.client.gui.screens.Screen;
          import net.minecraft.client.input.KeyEvent;
          import net.minecraft.client.player.LocalPlayer;
          import net.minecraft.network.chat.CommonComponents;
          import net.minecraft.network.chat.Component;

          /** Тп-точки: вводишь название и сохраняешь текущую позицию, клик по точке - телепорт. */
          public class WaypointsScreen extends Screen {
              private static final int PAGE_SIZE = 4;
              private static final int ROW_W = 190;
              private static final int ROW_H = 24;

              private final Screen parent;
              private EditBox nameInput;
              private StringWidget status;
              private Component statusMsg = Component.empty();
              private int page;

              public WaypointsScreen(Screen parent) {
                  super(Component.translatable("locate_gui.wp.title"));
                  this.parent = parent;
              }

              @Override
              protected void init() {
                  String keep = nameInput == null ? "" : nameInput.getValue();
                  int cx = width / 2;
                  int left = cx - 107;
                  int y = Math.max(6, (height - 200) / 2);

                  addRenderableWidget(new StringWidget(cx - font.width(title) / 2, y, font.width(title), 9, title, font));
                  y += 16;

                  nameInput = addRenderableWidget(new EditBox(font, left, y, 150, 20,
                          Component.translatable("locate_gui.wp.name")));
                  nameInput.setMaxLength(24);
                  nameInput.setHint(Component.translatable("locate_gui.wp.name"));
                  nameInput.setValue(keep);
                  setInitialFocus(nameInput);

                  addRenderableWidget(Button.builder(Component.translatable("locate_gui.wp.save"), b -> save())
                          .bounds(left + 154, y, 60, 20).build());
                  y += 26;

                  List<Waypoints.Point> points = Waypoints.all();
                  int pages = Math.max(1, (points.size() + PAGE_SIZE - 1) / PAGE_SIZE);
                  page = Math.max(0, Math.min(page, pages - 1));

                  int listTop = y;
                  if (points.isEmpty()) {
                      addRenderableWidget(new StringWidget(cx - 100, listTop + 6, 200, 9,
                              Component.translatable("locate_gui.wp.empty"), font));
                  }
                  int from = page * PAGE_SIZE;
                  int to = Math.min(points.size(), from + PAGE_SIZE);
                  for (int i = from; i < to; i++) {
                      Waypoints.Point p = points.get(i);
                      int rowY = listTop + (i - from) * ROW_H;

                      addRenderableWidget(Button.builder(
                              Component.translatable("locate_gui.wp.entry", p.name(), Waypoints.dimLabel(p.dimension()),
                                      p.bx(), p.by(), p.bz()),
                              b -> teleport(p))
                              .bounds(left, rowY, ROW_W, 20).build());

                      addRenderableWidget(Button.builder(Component.literal("X"), b -> {
                          Waypoints.remove(p);
                          statusMsg = Component.translatable("locate_gui.wp.deleted", p.name());
                          rebuildWidgets();
                      }).bounds(left + ROW_W + 4, rowY, 20, 20).build());
                  }
                  y = listTop + PAGE_SIZE * ROW_H + 2;

                  addRenderableWidget(Button.builder(Component.literal("<"), b -> {
                      if (page > 0) {
                          page--;
                          rebuildWidgets();
                      }
                  }).bounds(left, y, 20, 20).build());
                  addRenderableWidget(new StringWidget(cx - 40, y + 6, 80, 9,
                          Component.translatable("locate_gui.wp.page", page + 1, pages), font));
                  addRenderableWidget(Button.builder(Component.literal(">"), b -> {
                      if (page < pages - 1) {
                          page++;
                          rebuildWidgets();
                      }
                  }).bounds(left + ROW_W + 4, y, 20, 20).build());
                  y += 24;

                  status = addRenderableWidget(new StringWidget(cx - 150, y, 300, 9, statusMsg, font));
                  y += 14;

                  addRenderableWidget(Button.builder(CommonComponents.GUI_DONE, b -> onClose())
                          .bounds(left, y, 214, 20).build());
              }

              private void save() {
                  String name = nameInput.getValue().replaceAll("\\s+", " ").trim();
                  if (name.isEmpty()) {
                      statusMsg = Component.translatable("locate_gui.wp.need_name");
                      status.setMessage(statusMsg);
                      return;
                  }
                  LocalPlayer player = minecraft.player;
                  if (player == null || minecraft.level == null) {
                      return;
                  }
                  boolean replaced = Waypoints.add(new Waypoints.Point(name,
                          minecraft.level.dimension().identifier().toString(),
                          player.getX(), player.getY(), player.getZ()));
                  statusMsg = Component.translatable(replaced ? "locate_gui.wp.updated" : "locate_gui.wp.saved", name);
                  nameInput.setValue("");
                  page = Integer.MAX_VALUE; // уйти на последнюю страницу, там новая точка
                  rebuildWidgets();
              }

              private void teleport(Waypoints.Point p) {
                  Teleport.go(minecraft, p, msg -> {
                      if (minecraft.player != null) {
                          minecraft.player.sendSystemMessage(msg);
                      }
                  });
                  minecraft.gui.setScreen(null);
              }

              @Override
              public boolean keyPressed(KeyEvent event) {
                  if (nameInput.isFocused()
                          && (event.key() == InputConstants.KEY_RETURN || event.key() == InputConstants.KEY_NUMPADENTER)) {
                      save();
                      return true;
                  }
                  return super.keyPressed(event);
              }

              @Override
              public void onClose() {
                  minecraft.gui.setScreen(parent);
              }
          }
          LOCATE_EOF

          cat > src/main/java/dev/chester/locategui/Waypoints.java <<'LOCATE_EOF'
          package dev.chester.locategui;

          import java.io.IOException;
          import java.nio.charset.StandardCharsets;
          import java.nio.file.Files;
          import java.nio.file.Path;
          import java.util.ArrayList;
          import java.util.List;
          import net.fabricmc.loader.api.FabricLoader;
          import net.minecraft.network.chat.Component;

          /** Хранилище тп-точек: config/locate_gui_waypoints.txt, строка = имя, измерение, x, y, z через TAB. */
          public final class Waypoints {
              public record Point(String name, String dimension, double x, double y, double z) {
                  public int bx() {
                      return (int) Math.floor(x);
                  }

                  public int by() {
                      return (int) Math.floor(y);
                  }

                  public int bz() {
                      return (int) Math.floor(z);
                  }
              }

              private static final List<Point> POINTS = new ArrayList<>();
              private static boolean loaded;

              private Waypoints() {
              }

              private static Path file() {
                  return FabricLoader.getInstance().getConfigDir().resolve("locate_gui_waypoints.txt");
              }

              public static synchronized List<Point> all() {
                  load();
                  return new ArrayList<>(POINTS);
              }

              /** Возвращает true, если точка с таким именем уже была и её обновили. */
              public static synchronized boolean add(Point p) {
                  load();
                  boolean replaced = false;
                  for (int i = 0; i < POINTS.size(); i++) {
                      if (POINTS.get(i).name().equalsIgnoreCase(p.name())) {
                          POINTS.set(i, p);
                          replaced = true;
                          break;
                      }
                  }
                  if (!replaced) {
                      POINTS.add(p);
                  }
                  save();
                  return replaced;
              }

              public static synchronized void remove(Point p) {
                  load();
                  POINTS.removeIf(q -> q.name().equalsIgnoreCase(p.name()));
                  save();
              }

              public static Component dimLabel(String dim) {
                  return switch (dim) {
                      case "minecraft:overworld" -> Component.translatable("locate_gui.dim.overworld");
                      case "minecraft:the_nether" -> Component.translatable("locate_gui.dim.the_nether");
                      case "minecraft:the_end" -> Component.translatable("locate_gui.dim.the_end");
                      default -> Component.literal(dim);
                  };
              }

              private static void load() {
                  if (loaded) {
                      return;
                  }
                  loaded = true;
                  Path f = file();
                  if (!Files.exists(f)) {
                      return;
                  }
                  try {
                      for (String line : Files.readAllLines(f, StandardCharsets.UTF_8)) {
                          String[] parts = line.split("\t");
                          if (parts.length != 5) {
                              continue;
                          }
                          try {
                              POINTS.add(new Point(parts[0], parts[1],
                                      Double.parseDouble(parts[2]),
                                      Double.parseDouble(parts[3]),
                                      Double.parseDouble(parts[4])));
                          } catch (NumberFormatException ignored) {
                              // битую строку пропускаем
                          }
                      }
                  } catch (IOException e) {
                      System.out.println("[Locate GUI] cannot read waypoints: " + e);
                  }
              }

              private static void save() {
                  List<String> lines = new ArrayList<>();
                  for (Point p : POINTS) {
                      lines.add(p.name() + "\t" + p.dimension() + "\t" + p.x() + "\t" + p.y() + "\t" + p.z());
                  }
                  try {
                      Files.write(file(), lines, StandardCharsets.UTF_8);
                  } catch (IOException e) {
                      System.out.println("[Locate GUI] cannot save waypoints: " + e);
                  }
              }
          }
          LOCATE_EOF

          cat > src/main/java/dev/chester/locategui/Teleport.java <<'LOCATE_EOF'
          package dev.chester.locategui;

          import java.util.Locale;
          import java.util.Set;
          import java.util.UUID;
          import java.util.function.Consumer;
          import net.minecraft.client.Minecraft;
          import net.minecraft.core.registries.Registries;
          import net.minecraft.network.chat.Component;
          import net.minecraft.resources.Identifier;
          import net.minecraft.resources.ResourceKey;
          import net.minecraft.server.MinecraftServer;
          import net.minecraft.server.level.ServerLevel;
          import net.minecraft.server.level.ServerPlayer;
          import net.minecraft.world.level.Level;

          /**
           * Телепорт на сохранённую точку.
           * В одиночной игре - напрямую через встроенный сервер (читы не нужны, работает и между измерениями).
           * На чужом сервере - командой /tp, поэтому там нужны права.
           */
          public final class Teleport {
              private Teleport() {
              }

              public static void go(Minecraft mc, Waypoints.Point p, Consumer<Component> out) {
                  if (mc.player == null || mc.level == null) {
                      return;
                  }

                  MinecraftServer server = mc.getSingleplayerServer();
                  if (server == null) {
                      String currentDim = mc.level.dimension().identifier().toString();
                      String tp = String.format(Locale.ROOT, "tp @s %.2f %.2f %.2f", p.x(), p.y(), p.z());
                      mc.player.connection.sendCommand(
                              p.dimension().equals(currentDim) ? tp : "execute in " + p.dimension() + " run " + tp);
                      out.accept(Component.translatable("locate_gui.wp.command_sent", p.name()));
                      return;
                  }

                  ResourceKey<Level> dimension = dimensionKey(p.dimension());
                  if (dimension == null) {
                      out.accept(Component.translatable("locate_gui.wp.failed", p.name()));
                      return;
                  }
                  UUID id = mc.player.getUUID();

                  server.execute(() -> {
                      boolean ok = false;
                      try {
                          ServerLevel level = server.getLevel(dimension);
                          ServerPlayer player = server.getPlayerList().getPlayer(id);
                          if (level != null && player != null) {
                              player.teleportTo(level, p.x(), p.y(), p.z(), Set.of(),
                                      player.getYRot(), player.getXRot(), true);
                              ok = true;
                          }
                      } catch (RuntimeException e) {
                          ok = false;
                      }
                      boolean result = ok;
                      mc.execute(() -> out.accept(Component.translatable(
                              result ? "locate_gui.wp.teleported" : "locate_gui.wp.failed", p.name())));
                  });
              }

              private static ResourceKey<Level> dimensionKey(String dim) {
                  try {
                      int i = dim.indexOf(':');
                      Identifier id = i < 0
                              ? Identifier.fromNamespaceAndPath("minecraft", dim)
                              : Identifier.fromNamespaceAndPath(dim.substring(0, i), dim.substring(i + 1));
                      return ResourceKey.create(Registries.DIMENSION, id);
                  } catch (RuntimeException e) {
                      return null;
                  }
              }
          }
          LOCATE_EOF

          cat > src/main/java/dev/chester/locategui/HotkeyScreen.java <<'LOCATE_EOF'
          package dev.chester.locategui;

          import com.mojang.blaze3d.platform.InputConstants;
          import net.minecraft.client.KeyMapping;
          import net.minecraft.client.gui.components.Button;
          import net.minecraft.client.gui.components.StringWidget;
          import net.minecraft.client.gui.screens.Screen;
          import net.minecraft.client.input.KeyEvent;
          import net.minecraft.network.chat.CommonComponents;
          import net.minecraft.network.chat.Component;

          /** Экран из Mod Menu: переназначение клавиши открытия GUI. */
          public class HotkeyScreen extends Screen {
              private final Screen parent;
              private boolean waiting;
              private Button keyButton;

              public HotkeyScreen(Screen parent) {
                  super(Component.translatable("locate_gui.hotkey.title"));
                  this.parent = parent;
              }

              @Override
              protected void init() {
                  int cx = width / 2;
                  int cy = height / 2;

                  addRenderableWidget(new StringWidget(cx - font.width(title) / 2, cy - 45, font.width(title), 9, title, font));

                  keyButton = addRenderableWidget(Button.builder(label(), b -> {
                      waiting = true;
                      b.setMessage(Component.translatable("locate_gui.hotkey.waiting"));
                  }).bounds(cx - 100, cy - 20, 200, 20).build());

                  addRenderableWidget(Button.builder(Component.translatable("locate_gui.hotkey.reset"),
                          b -> apply(LocateModClient.openKey.getDefaultKey()))
                          .bounds(cx - 100, cy + 5, 200, 20).build());

                  addRenderableWidget(Button.builder(CommonComponents.GUI_DONE, b -> onClose())
                          .bounds(cx - 100, cy + 30, 200, 20).build());
              }

              private Component label() {
                  return Component.translatable("locate_gui.hotkey.current",
                          LocateModClient.openKey.getTranslatedKeyMessage());
              }

              private void apply(InputConstants.Key key) {
                  LocateModClient.openKey.setKey(key);
                  KeyMapping.resetMapping();
                  minecraft.options.save();
                  waiting = false;
                  keyButton.setMessage(label());
              }

              @Override
              public boolean keyPressed(KeyEvent event) {
                  if (waiting) {
                      if (event.key() == InputConstants.KEY_ESCAPE) {
                          waiting = false;
                          keyButton.setMessage(label());
                      } else {
                          apply(InputConstants.getKey(event));
                      }
                      return true;
                  }
                  return super.keyPressed(event);
              }

              @Override
              public void onClose() {
                  minecraft.gui.setScreen(parent);
              }
          }
          LOCATE_EOF

          cat > src/main/java/dev/chester/locategui/Names.java <<'LOCATE_EOF'
          package dev.chester.locategui;

          import java.util.ArrayList;
          import java.util.LinkedHashMap;
          import java.util.List;
          import java.util.Locale;
          import java.util.Map;
          import java.util.regex.Pattern;

          /** Словарь: русские и английские названия -> структура/биом из команды /locate. */
          public final class Names {
              public enum Kind {
                  STRUCTURE("structure"),
                  BIOME("biome");

                  public final String command;

                  Kind(String command) {
                      this.command = command;
                  }
              }

              /** tag = true значит "#minecraft:village" (тег), иначе конкретный id. */
              public record Entry(Kind kind, String namespace, String path, boolean tag, String label) {
                  public String id() {
                      return namespace + ":" + path;
                  }

                  public String arg() {
                      return (tag ? "#" : "") + id();
                  }
              }

              private static final Map<String, Entry> LOOKUP = new LinkedHashMap<>();
              private static final Pattern RAW_ID = Pattern.compile("#?[a-z0-9_.-]+(:[a-z0-9_./-]+)?");

              static {
                  // ---------- Структуры ----------
                  structTag("village", "деревня", "деревни", "поселение");
                  struct("stronghold", "крепость", "стронгхолд");
                  structTag("mineshaft", "шахта", "заброшенная шахта");
                  struct("desert_pyramid", "пирамида в пустыне", "пустынный храм", "храм в пустыне");
                  struct("jungle_temple", "храм в джунглях", "джунглевый храм");
                  struct("swamp_hut", "хижина ведьмы", "болотная хижина", "хижина в болоте");
                  struct("igloo", "иглу");
                  struct("pillager_outpost", "форпост разбойников", "аванпост разбойников", "форпост", "аванпост");
                  struct("mansion", "лесной особняк", "особняк", "woodland mansion");
                  struct("monument", "океанический монумент", "подводный храм", "монумент", "ocean monument");
                  structTag("ocean_ruin", "подводные руины", "руины в океане", "океанские руины");
                  structTag("shipwreck", "кораблекрушение", "затонувший корабль", "корабль");
                  struct("buried_treasure", "клад", "закопанное сокровище", "сокровище");
                  struct("ancient_city", "древний город");
                  structTag("ruined_portal", "руины портала", "разрушенный портал");
                  struct("bastion_remnant", "бастион", "остатки бастиона", "bastion");
                  struct("fortress", "незер крепость", "адская крепость", "крепость незера", "крепость нижнего мира");
                  struct("end_city", "город края", "энд город", "город энда");
                  struct("trial_chambers", "залы испытаний", "испытательные залы", "камеры испытаний");
                  struct("trail_ruins", "руины тропы", "руины на тропе");
                  struct("nether_fossil", "ископаемое незера", "незер ископаемое");

                  // ---------- Биомы ----------
                  biome("plains", "равнины");
                  biome("sunflower_plains", "подсолнуховые равнины");
                  biome("snowy_plains", "снежные равнины");
                  biome("ice_spikes", "ледяные шипы");
                  biome("forest", "лес");
                  biome("birch_forest", "берёзовый лес");
                  biome("dark_forest", "тёмный лес");
                  biome("flower_forest", "цветочный лес");
                  biome("pale_garden", "бледный сад");
                  biome("taiga", "тайга");
                  biome("snowy_taiga", "снежная тайга");
                  biome("old_growth_pine_taiga", "древняя сосновая тайга", "гигантская тайга");
                  biome("jungle", "джунгли");
                  biome("bamboo_jungle", "бамбуковые джунгли");
                  biome("sparse_jungle", "редкие джунгли");
                  biome("desert", "пустыня");
                  biome("savanna", "саванна");
                  biome("badlands", "бесплодные земли", "меза");
                  biome("eroded_badlands", "эродированные бесплодные земли");
                  biome("wooded_badlands", "лесистые бесплодные земли");
                  biome("swamp", "болото");
                  biome("mangrove_swamp", "мангровое болото", "мангровые заросли");
                  biome("mushroom_fields", "грибное поле", "грибной остров");
                  biome("cherry_grove", "вишнёвая роща");
                  biome("meadow", "луг");
                  biome("grove", "роща");
                  biome("snowy_slopes", "заснеженные склоны");
                  biome("jagged_peaks", "зубчатые пики");
                  biome("frozen_peaks", "замёрзшие пики");
                  biome("stony_peaks", "каменистые пики");
                  biome("windswept_hills", "ветреные холмы");
                  biome("beach", "пляж");
                  biome("snowy_beach", "снежный пляж");
                  biome("stony_shore", "каменистый берег");
                  biome("river", "река");
                  biome("frozen_river", "замёрзшая река");
                  biome("ocean", "океан");
                  biome("deep_ocean", "глубокий океан");
                  biome("warm_ocean", "тёплый океан");
                  biome("lukewarm_ocean", "умеренный океан");
                  biome("cold_ocean", "холодный океан");
                  biome("frozen_ocean", "замёрзший океан");
                  biome("dripstone_caves", "капельниковые пещеры");
                  biome("lush_caves", "пышные пещеры");
                  biome("deep_dark", "глубокая тьма");
                  biome("nether_wastes", "пустоши нижнего мира", "пустоши незера");
                  biome("soul_sand_valley", "долина песка душ");
                  biome("crimson_forest", "багровый лес");
                  biome("warped_forest", "искажённый лес");
                  biome("basalt_deltas", "базальтовые дельты");
                  biome("the_end", "край");
                  biome("end_highlands", "высокогорья края");
                  biome("end_midlands", "средние земли края");
                  biome("small_end_islands", "малые острова края");
                  biome("end_barrens", "пустоши края");
              }

              private Names() {
              }

              private static void struct(String path, String ru, String... aliases) {
                  add(Kind.STRUCTURE, path, false, ru, aliases);
              }

              private static void structTag(String path, String ru, String... aliases) {
                  add(Kind.STRUCTURE, path, true, ru, aliases);
              }

              private static void biome(String path, String ru, String... aliases) {
                  add(Kind.BIOME, path, false, ru, aliases);
              }

              private static void add(Kind kind, String path, boolean tag, String ru, String... aliases) {
                  String label = ru.substring(0, 1).toUpperCase(Locale.ROOT) + ru.substring(1);
                  Entry e = new Entry(kind, "minecraft", path, tag, label);
                  LOOKUP.put(norm(ru), e);
                  LOOKUP.putIfAbsent(norm(path), e);
                  for (String a : aliases) {
                      LOOKUP.putIfAbsent(norm(a), e);
                  }
              }

              private static String norm(String s) {
                  return s.toLowerCase(Locale.ROOT)
                          .replace('ё', 'е')
                          .replace("minecraft:", "")
                          .replace('_', ' ')
                          .trim()
                          .replaceAll("\\s+", " ");
              }

              /** Возвращает запись по русскому/английскому названию или null, если не понял. */
              public static Entry resolve(String input) {
                  String raw = input.trim().toLowerCase(Locale.ROOT);
                  if (raw.startsWith("/")) {
                      raw = raw.substring(1).trim();
                  }
                  if (raw.isEmpty()) {
                      return null;
                  }
                  String key = norm(raw.startsWith("#") ? raw.substring(1) : raw);

                  Entry exact = LOOKUP.get(key);
                  if (exact != null) {
                      return exact;
                  }

                  // Единственное совпадение по началу слова: "дерев" -> деревня
                  List<Entry> matches = new ArrayList<>();
                  for (Map.Entry<String, Entry> me : LOOKUP.entrySet()) {
                      if (me.getKey().startsWith(key) && !matches.contains(me.getValue())) {
                          matches.add(me.getValue());
                      }
                  }
                  if (matches.size() == 1) {
                      return matches.get(0);
                  }

                  // Сырой id (например modid:structure или #minecraft:village) - как структура
                  if (RAW_ID.matcher(raw).matches()) {
                      boolean tag = raw.startsWith("#");
                      String id = tag ? raw.substring(1) : raw;
                      int i = id.indexOf(':');
                      String ns = i < 0 ? "minecraft" : id.substring(0, i);
                      String path = i < 0 ? id : id.substring(i + 1);
                      return new Entry(Kind.STRUCTURE, ns, path, tag, raw);
                  }
                  return null;
              }
          }
          LOCATE_EOF

          cat > src/main/java/dev/chester/locategui/LocateSearch.java <<'LOCATE_EOF'
          package dev.chester.locategui;

          import com.mojang.datafixers.util.Pair;
          import java.util.Optional;
          import java.util.function.Consumer;
          import net.minecraft.client.Minecraft;
          import net.minecraft.core.BlockPos;
          import net.minecraft.core.Holder;
          import net.minecraft.core.HolderSet;
          import net.minecraft.core.Registry;
          import net.minecraft.core.registries.Registries;
          import net.minecraft.network.chat.Component;
          import net.minecraft.resources.Identifier;
          import net.minecraft.resources.ResourceKey;
          import net.minecraft.server.MinecraftServer;
          import net.minecraft.server.level.ServerLevel;
          import net.minecraft.tags.TagKey;
          import net.minecraft.world.level.Level;
          import net.minecraft.world.level.biome.Biome;
          import net.minecraft.world.level.levelgen.structure.Structure;

          /**
           * Собственный поиск структур и биомов (замена /locate).
           * В одиночной игре идёт напрямую через встроенный сервер, команда и читы не нужны.
           * На чужом сервере у клиента нет данных мира, поэтому там остаётся только запасной вариант - команда.
           */
          public final class LocateSearch {
              private LocateSearch() {
              }

              public static void run(Minecraft mc, Names.Entry entry, Consumer<Component> out) {
                  if (mc.player == null || mc.level == null) {
                      return;
                  }

                  MinecraftServer server = mc.getSingleplayerServer();
                  if (server == null) {
                      mc.player.connection.sendCommand("locate " + entry.kind().command + " " + entry.arg());
                      out.accept(Component.translatable("locate_gui.result.command_sent"));
                      return;
                  }

                  BlockPos origin = mc.player.blockPosition();
                  ResourceKey<Level> dimension = mc.level.dimension();
                  out.accept(Component.translatable("locate_gui.result.searching", entry.label()));

                  server.execute(() -> {
                      BlockPos found = null;
                      ServerLevel level = server.getLevel(dimension);
                      if (level != null) {
                          try {
                              found = entry.kind() == Names.Kind.STRUCTURE
                                      ? findStructure(level, entry, origin)
                                      : findBiome(level, entry, origin);
                          } catch (RuntimeException e) {
                              found = null;
                          }
                      }
                      BlockPos result = found;
                      mc.execute(() -> {
                          Component message = describe(entry, origin, result);
                          out.accept(message);
                          if (mc.player != null) {
                              mc.player.sendSystemMessage(message);
                          }
                      });
                  });
              }

              private static BlockPos findStructure(ServerLevel level, Names.Entry entry, BlockPos origin) {
                  Registry<Structure> registry = level.registryAccess().lookupOrThrow(Registries.STRUCTURE);
                  Identifier id = Identifier.fromNamespaceAndPath(entry.namespace(), entry.path());

                  HolderSet<Structure> set;
                  if (entry.tag()) {
                      Optional<HolderSet.Named<Structure>> named = registry.get(TagKey.create(Registries.STRUCTURE, id));
                      if (named.isEmpty()) {
                          return null;
                      }
                      set = named.get();
                  } else {
                      Optional<Holder.Reference<Structure>> ref = registry.get(ResourceKey.create(Registries.STRUCTURE, id));
                      if (ref.isEmpty()) {
                          return null;
                      }
                      set = HolderSet.direct(ref.get());
                  }

                  Pair<BlockPos, Holder<Structure>> pair =
                          level.getChunkSource().getGenerator().findNearestMapStructure(level, set, origin, 100, false);
                  return pair == null ? null : pair.getFirst();
              }

              private static BlockPos findBiome(ServerLevel level, Names.Entry entry, BlockPos origin) {
                  ResourceKey<Biome> key = ResourceKey.create(Registries.BIOME,
                          Identifier.fromNamespaceAndPath(entry.namespace(), entry.path()));
                  Pair<BlockPos, Holder<Biome>> pair =
                          level.findClosestBiome3d(holder -> holder.is(key), origin, 6400, 32, 64);
                  return pair == null ? null : pair.getFirst();
              }

              private static Component describe(Names.Entry entry, BlockPos origin, BlockPos pos) {
                  if (pos == null) {
                      return Component.translatable("locate_gui.result.not_found", entry.label());
                  }
                  double dx = pos.getX() - origin.getX();
                  double dz = pos.getZ() - origin.getZ();
                  long dist = Math.round(Math.sqrt(dx * dx + dz * dz));
                  return Component.translatable("locate_gui.result.found", entry.label(), pos.getX(), pos.getZ(), dist);
              }
          }
          LOCATE_EOF

