      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.7.0

      - name: Build mod
        run: gradle build --stacktrace

      - name: Dump Minecraft API (only on failure)
        if: failure()
        run: |
          CP=$(gradle -q printMcClasspath | grep '^CP:' | sed 's/^CP://' | tr '\n' ':')
          for c in net.minecraft.client.Minecraft net.minecraft.client.gui.Gui net.minecraft.client.gui.components.StringWidget net.minecraft.client.player.LocalPlayer net.minecraft.client.gui.components.ChatComponent net.minecraft.server.level.ServerPlayer net.minecraft.resources.ResourceKey; do
            echo "=== $c ==="
            javap -cp "$CP" "$c" | grep -iE 'screen|align|class |message|chat|teleport|identifier' || true
          done

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: locate-gui-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 30

  release:
    # Релиз создаётся при пуше тега вида v1.0.1
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download jar
        uses: actions/download-artifact@v4
        with:
          name: locate-gui-jar
          path: dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.jar
